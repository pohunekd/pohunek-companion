[package]
name = "pohunek-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native desktop companion for Pohunek sessions."

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
slint = { workspace = true }
pohunek-companion-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# winit's macOS activation policy is reachable only through this unstable Slint API.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true
