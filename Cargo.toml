[workspace]
resolver = "3"
members = ["crates/app", "crates/core"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/pohunekd/pohunek-companion"

[workspace.dependencies]
# Slint's default features minus backend-qt (no Qt toolchain needed), with:
# - renderer-software: 22 to 30 MB RSS on Linux against 84 to 94 MB with
#   femtovg, whose GL driver stack dominates; the UI is flat lists and text.
# - no accessibility: it adds about 1.7 MB to the binary; screen readers are
#   not a target for this owner-only tool.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "system-tray",
] }
slint-build = "1.18.1"

# `unstable-dynamic` is the CompleteEnv engine behind `completions --dynamic`.
clap = { version = "4", features = ["derive", "string"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }

pohunek-companion-core = { path = "crates/core" }
# Pinned to one Pohunek release tag: the protocol client, and the assistant
# launch orchestration that `pohunek assistant` is a thin wrapper over.
pohunek-client = { git = "https://github.com/zajca/pohunek", tag = "v0.35.2" }
pohunek-assistant = { git = "https://github.com/zajca/pohunek", tag = "v0.35.2" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["parsing", "formatting"] }
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
# Release download for the installer: rustls with the bundled webpki roots (no
# system trust store, no OpenSSL), gzip decoding by flate2, tar entries read
# one by one so the extractor can refuse every non-regular entry.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
sha2 = "0.10"

[workspace.lints.rust]
# `deny`, not `forbid`: Slint-generated code carries its own allow attributes.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies carry no debug info: it is the largest share of dev link time
# and of target/ size, and their backtraces are rarely needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Fat LTO and opt-level "s" bring the release binary under the 15 MB target
# (13.6 MB on Linux, 9.0 MB on macOS); panic = "abort" drops unwinding tables.
lto = "fat"
opt-level = "s"
panic = "abort"
codegen-units = 1
strip = true
